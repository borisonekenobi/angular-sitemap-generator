name: workflow.yml
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Get Version
        id: get_version
        run: |
          CLEAN_ACTOR=$(echo "${{ github.actor }}" | tr -cd '[:alnum:]._-')
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "version=$(node ./.github/scripts/get-version.js $CLEAN_ACTOR)" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node ./.github/scripts/get-version.js)" >> "$GITHUB_OUTPUT"
          fi

  publish-prerelease:
    name: Publish Prerelease Version
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Create Prerelease Version
        run: npm version ${{ needs.get-version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Pack Prerelease Version
        run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: angular-sitemap-generator-${{ needs.get-version.outputs.version }}.tgz
          path: angular-sitemap-generator-${{ needs.get-version.outputs.version }}.tgz

  test-angular18:
    name: Test Angular 18
    needs: [ get-version, publish-prerelease ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/angular18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: angular-sitemap-generator-${{ needs.get-version.outputs.version }}.tgz
          path: tests/angular18

      - name: Install Prerelease Version
        run: npm install angular-sitemap-generator-${{ needs.get-version.outputs.version }}.tgz

      - name: Generate Sitemap
        run: npm run test

      - name: Upload Generated Sitemap
        uses: actions/upload-artifact@v7
        with:
          name: angular18-sitemap.xml
          path: tests/angular18/public/sitemap.xml

      - name: Upload Generated Robots.txt
        uses: actions/upload-artifact@v7
        with:
          name: angular18-robots.txt
          path: tests/angular18/public/robots.txt

  analyze-angular18:
    name: Analyze Angular 18 Output
    needs: test-angular18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: angular18-sitemap.xml
      - uses: actions/download-artifact@v8
        with:
          name: angular18-robots.txt

      - name: Install dependencies
        run: npm ci

      - name: Analyze Results
        run: node ./.github/scripts/analyze-results.js 18

  test-angular19:
    name: Test Angular 19
    needs: [ get-version, publish-prerelease ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/angular19
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: angular-sitemap-generator-${{ needs.get-version.outputs.version }}.tgz
          path: tests/angular19

      - name: Install Prerelease Version
        run: npm install angular-sitemap-generator-${{ needs.get-version.outputs.version }}.tgz

      - name: Generate Sitemap
        run: npm run test

      - name: Upload Generated Sitemap
        uses: actions/upload-artifact@v7
        with:
          name: angular19-sitemap.xml
          path: tests/angular19/public/sitemap.xml

      - name: Upload Generated Robots.txt
        uses: actions/upload-artifact@v7
        with:
          name: angular19-robots.txt
          path: tests/angular19/public/robots.txt

  analyze-angular19:
    name: Analyze Angular 19 Output
    needs: test-angular19
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: angular19-sitemap.xml
      - uses: actions/download-artifact@v8
        with:
          name: angular19-robots.txt

      - name: Install dependencies
        run: npm ci

      - name: Analyze Results
        run: node ./.github/scripts/analyze-results.js 19

  test-angular20:
